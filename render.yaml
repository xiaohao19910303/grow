services:
  - type: web
    name: zhixingchengzhang
    runtime: python
    buildCommand: pip install -r requirements.txt && python 知行成长/server/prepare_materials.py /opt/render/project/src/.grow-public-materials
    startCommand: cd 知行成长/server && python deployment.py serve --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: CLOUD_DEPLOY
        value: "1"
      - key: LEARN_ROOT
        sync: false
      - key: PLAN_CONTENT_BACKEND
        value: github
      - key: GITHUB_CONTENT_REPO
        sync: false
      - key: GITHUB_CONTENT_BRANCH
        value: main
      - key: GITHUB_CONTENT_TOKEN
        sync: false
      - key: APP_USERNAME
        value: owner
      - key: APP_PASSWORD
        sync: false
      - key: ACCOUNT_ENCRYPTION_KEY
        sync: false
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GROW_SCHEDULED_READING_ENABLED
        value: "0"
    healthCheckPath: /api/health
    autoDeploy: true
